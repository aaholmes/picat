[project]
name = "picat"
version = "0.1.0"
description = "Async image display over a slow ssh connection: immediate low-res preview, with full resolution loading in the background. For the kitty terminal, works in tmux."
authors = [
    { name = "Adam A Holmes", email = "adamaholmes@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
picat = "picat:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
